<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бейджики · Shoutout Desk</title><link rel="stylesheet" href="/badge.css"><link rel="stylesheet" href="/editor.css"></head>
<body>
<header><div><span class="eyebrow">SHOUTOUT DESK · LOCAL PREVIEW</span><h1>Бейджики</h1></div><label class="toggle"><input id="global-enabled" type="checkbox"><span>Показывать бейджики</span></label></header>
<main>
  <section class="preview-section"><div class="preview-heading"><h2>Предпросмотр</h2><div class="preview-actions"><button id="animate" class="icon-button" title="Повторить появление и уход" aria-label="Повторить появление и уход"><i data-lucide="rotate-cw"></i></button><button id="animate-exit" class="icon-button" title="Проверить уход" aria-label="Проверить уход"><i data-lucide="log-out"></i></button></div></div><div id="preview" class="badge-stage"></div>
    <div class="source-row"><label class="source-field">URL источника OBS<input id="source-url" readonly spellcheck="false"></label><button id="copy" class="icon-button" title="Скопировать URL" aria-label="Скопировать URL"><i data-lucide="copy"></i></button><span class="size" id="source-size">560 × 560</span></div>
  </section>
  <div class="workspace">
    <section class="people-section"><h2>Стримеры <span id="count"></span></h2><input id="search" type="search" placeholder="Поиск по нику" aria-label="Поиск по нику"><div id="people"></div><div id="empty" hidden>Список пуст</div></section>
    <section class="settings-section"><div class="settings-heading"><h2 id="selected-name">Общая тема</h2><button id="default-theme" title="Редактировать общую тему"><i data-lucide="palette"></i><span>Общая тема</span></button></div>
      <div id="person-fields" hidden><div class="person-toggles"><label class="toggle"><input id="person-enabled" type="checkbox"><span>Показывать этого стримера</span></label><label class="toggle"><input id="person-custom" type="checkbox"><span>Своя тема</span></label></div><label>Описание<textarea id="description" maxlength="140" rows="2"></textarea></label><div class="description-footer"><span id="description-count">0 / 140</span><button id="test-selected"><i data-lucide="play"></i><span>Тест в OBS</span></button></div></div>
      <form id="theme-form"><fieldset id="theme-controls"><div class="control-group"><h3>Оформление</h3><div id="designs" class="design-picker" role="group" aria-label="Вариант бейджика"></div></div><div class="control-group"><h3 id="palette-heading">Цвета</h3><div class="fields" id="colors"></div></div><div class="control-group"><h3>Размеры</h3><div class="fields" id="sizes"></div></div><div class="control-group"><h3>Текст и фон</h3><div class="fields" id="typography"></div></div><div class="control-group"><h3>Штамп</h3><div id="stamp-switch"></div><fieldset id="stamp-options"><div class="fields" id="stamp-fields"></div></fieldset></div><div class="control-group"><h3>Анимация</h3><div class="fields" id="motion"></div></div></fieldset></form>
      <div class="save-row"><span id="save-status" role="status">Без изменений</span><button id="reset" title="Сбросить цвета выбранного оформления"><i data-lucide="rotate-ccw"></i><span>Сбросить цвета</span></button><button id="save" class="primary"><i data-lucide="save"></i><span>Сохранить</span></button></div>
    </section>
  </div>
</main><div id="notice" role="status" hidden></div>
<script src="/icons.js"></script><script src="/render.js"></script><script src="/editor.js"></script>
</body></html>
