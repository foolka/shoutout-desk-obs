name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:source
      - run: npm run build
      - run: npm test
      - run: npm run package
      - name: Archive
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $folder = "release/shoutout-desk-obs-$version-windows-x64"
          Compress-Archive -Path "$folder/*" -DestinationPath "$folder.zip"
          (Get-FileHash "$folder.zip" -Algorithm SHA256).Hash + '  ' + (Split-Path "$folder.zip" -Leaf) | Set-Content "$folder.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: shoutout-desk-obs-windows-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
